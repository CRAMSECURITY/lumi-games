<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>LUMI GAMES · Mini App</title><style>
:root{color-scheme:dark;--bg:#100d20;--panel:#211936;--panel2:#2a2045;--purple:#ad77ff;--text:#f8f4ff;--muted:#b5a6cc;--pink:#ff77cb}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -10%,#432272 0,transparent 42%),var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh}.app{max-width:470px;margin:auto;padding:18px 16px 42px}.head{display:flex;align-items:center;justify-content:space-between;margin:0 0 20px}.logo{font-weight:900;font-size:24px;letter-spacing:.07em;background:linear-gradient(100deg,#fff,#d78bff,#9e6dff);-webkit-background-clip:text;color:transparent}.pill{font-size:11px;letter-spacing:.04em;padding:6px 10px;border:1px solid #784ab4;background:#322048;border-radius:99px;color:#dfc2ff}.hero{position:relative;background:linear-gradient(135deg,#372359,#1b1631);border:1px solid #7450a5;border-radius:24px;padding:24px 20px;overflow:hidden;margin-bottom:18px;box-shadow:0 20px 50px #0006}.hero:after{content:'✦';position:absolute;font-size:110px;right:-10px;top:-18px;color:#a575ff25}.hero h1{font-size:27px;line-height:1.12;margin:7px 0}.hero p{margin:8px 0 0;color:#d3c6e5}.hero .eyebrow{color:#dfadff;font-size:11px;font-weight:800;letter-spacing:.14em}.tabs{display:flex;gap:6px;margin-bottom:16px;background:#1f1930;padding:5px;border-radius:15px}.tabs button{background:transparent;color:var(--muted);flex:1;padding:11px 5px;font-size:13px}.tabs button.active{color:#fff;background:linear-gradient(120deg,#6f38b8,#9c58cf);box-shadow:0 3px 13px #a95eff45}button{border:0;border-radius:12px;background:#3c2b5b;color:#fff;font:inherit;font-weight:700;cursor:pointer;padding:12px 15px}button:disabled{opacity:.35;cursor:default}button:focus-visible{outline:3px solid #e5afff;outline-offset:2px}button.primary{background:linear-gradient(110deg,#8e4df4,#c764dc);box-shadow:0 6px 20px #9952fb45}.game-card{border:1px solid #604879;border-radius:19px;padding:17px;margin-bottom:12px;background:linear-gradient(120deg,#28203f,#1d192e);display:flex;gap:13px;align-items:center;cursor:pointer}.game-card .em{font-size:35px;min-width:54px;text-align:center}.game-card h3{font-size:16px;margin:0}.game-card p{color:var(--muted);font-size:12px;margin:3px 0}.arrow{margin-left:auto;font-size:22px;color:#d5aeff}.glass{border:1px solid #634a86;background:linear-gradient(140deg,#281d43,#1a172c);border-radius:20px;padding:18px;margin-bottom:14px;box-shadow:0 10px 24px #08041155}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.small{font-size:12px;color:var(--muted)}.score{font-weight:800;font-size:23px;color:#e0b1ff}.heading{font-size:21px;font-weight:900;margin:2px 0 8px}.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin:16px 0}.tile{aspect-ratio:1;border-radius:10px;padding:0;font-size:25px;background:#382750;border:1px solid #654780;box-shadow:inset 0 -4px #160e2b;transition:transform .12s,border-color .12s}.tile:active{transform:scale(.92)}.tile.selected{border:2px solid #fff6bb;transform:scale(1.06);background:#6b3b92}.notice{background:#31224b;border:1px solid #73519a;border-radius:12px;padding:11px;margin:12px 0;color:#edddff}.buttons{display:flex;gap:9px}.buttons>*{flex:1}.progress{height:8px;background:#403054;border-radius:50px;overflow:hidden;margin:9px 0 16px}.progress>div{height:100%;background:linear-gradient(90deg,#9d55e6,#ff87df);transition:width .3s}.wordgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:15px 0}.wordgrid button{font-size:24px;padding:12px 0;border:1px solid #654780;background:#382750}.wordgrid button.selected{background:#9059d8;border-color:#f2ceff}.wordlist{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0}.wordlist span{background:#45315f;border-radius:99px;padding:5px 10px;font-size:12px}.wordlist span.done{background:#315746;color:#b8ffd1}.memory{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin:18px 0}.memory button{aspect-ratio:1;font-size:30px;padding:0;background:#4d2d7e;border:1px solid #9a68d5;transition:background .2s}.memory button.up,.memory button.matched{background:#8450bd}.memory button.matched{opacity:.6}.footer{text-align:center;font-size:12px;color:#8e7ba9;margin:25px 0}.tag{font-size:11px;color:#dfb7ff}.hide{display:none!important}.center{text-align:center}.big{font-size:50px;margin:12px 0}#game{min-height:320px}
</style><script src="https://telegram.org/js/telegram-web-app.js"></script></head><body><main class="app"><header class="head"><div class="logo">LUMI <span style="color:#d698ff">💜</span> GAMES</div><span class="pill">MINI APP · BETA</span></header><section class="hero"><div class="eyebrow">МИНИ-ИГРЫ LUMI</div><h1>Дуэль умов<br>и утро без суеты</h1><p>Соревнуйся с другом или решай спокойные задачи для себя.</p></section><div id="home"><nav class="tabs"><button class="active" data-tab="duel">⚔️ Дуэль</button><button data-tab="morning">🌅 Утро</button></nav><div id="cards"></div></div><div id="game" class="hide"></div><div class="footer">LUMI · Игры в отдельной Mini App · PvP онлайн появится в следующей версии</div></main><script>
'use strict';try{window.Telegram?.WebApp?.ready();window.Telegram?.WebApp?.expand()}catch(e){}const $=s=>document.querySelector(s),game=$('#game'),home=$('#home');let mode='duel',state={},timeouts=[];const games={duel:[['💎','Кристальная дуэль','Собери три одинаковых символа'],['🔤','Битва слов','Сложи как можно больше слов']],morning:[['🧠','LUMI Memory','Найди все пары без спешки'],['💎','Кристаллы без таймера','Тот же пазл, но для отдыха']]};
function renderCards(){let section=$('#cards');section.innerHTML=games[mode].map(([emoji,name,desc])=>`<div class="game-card" role="button" tabindex="0" data-name="${name}"><span class="em">${emoji}</span><div><h3>${name}</h3><p>${desc}</p></div><span class="arrow">›</span></div>`).join('');section.querySelectorAll('.game-card').forEach(el=>{el.onclick=()=>launch(el.dataset.name);el.onkeydown=e=>{if(e.key==='Enter')launch(el.dataset.name)}})}
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{mode=b.dataset.tab;document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x===b));renderCards()});renderCards();function show(html){home.classList.add('hide');game.classList.remove('hide');game.innerHTML=html}function back(){timeouts.forEach(clearTimeout);timeouts=[];game.classList.add('hide');home.classList.remove('hide');game.innerHTML=''}function top(name,subtitle){return `<div class="row" style="margin-bottom:14px"><button id="back" style="font-size:13px">← Игры</button><span class="pill">${name}</span></div><div class="small" style="margin-bottom:9px">${subtitle}</div>`}function bindBack(){$('#back').onclick=back}function rnd(n){return Math.floor(Math.random()*n)}function shuffle(a){for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}
function launch(name){if(name.includes('Кристал'))crystal(name.includes('без таймера'));else if(name==='Битва слов')words();else memory()}
const gems=['💜','💎','⭐','🌙','🔮'];function newBoard(){return Array.from({length:36},()=>rnd(gems.length))}function adjacent(a,b){return Math.abs(Math.floor(a/6)-Math.floor(b/6))+Math.abs(a%6-b%6)===1}function findMatches(a){let found=new Set();for(let r=0;r<6;r++)for(let c=0;c<6;c++){let i=r*6+c;if(c<4&&a[i]===a[i+1]&&a[i]===a[i+2])[i,i+1,i+2].forEach(x=>found.add(x));if(r<4&&a[i]===a[i+6]&&a[i]===a[i+12])[i,i+6,i+12].forEach(x=>found.add(x))}return [...found]}function makeBoard(){let a=newBoard(),tries=0;while(findMatches(a).length&&tries++<100){a=newBoard()}return a}function settle(a){let score=0;for(let k=0;k<15;k++){let m=findMatches(a);if(!m.length)break;score+=m.length*10;for(let c=0;c<6;c++){let col=[];for(let r=5;r>=0;r--)if(!m.includes(r*6+c))col.push(a[r*6+c]);while(col.length<6)col.push(rnd(gems.length));for(let r=5;r>=0;r--)a[r*6+c]=col[5-r]}}return score}
function crystal(calm=false){state={board:makeBoard(),selected:null,scores:[0,0],player:0,moves:0,max:calm?12:6,calm,msg:calm?'Двигай соседние кристаллы, чтобы собрать ряд из трёх.':'Игрок 1 ходит первым; затем передайте телефон другу.'};drawCrystal()}
function drawCrystal(){let s=state;let turn= s.calm?'Спокойный режим':`Ход игрока ${s.player+1} из 2`;show(top('💎 Кристаллы',turn)+`<div class="glass"><div class="row"><div class="small">${s.calm?'Твои очки':'Игрок 1'}<div class="score">${s.scores[0]}</div></div><div class="small" style="text-align:right">${s.calm?'Без спешки':'Игрок 2'}<div class="score">${s.calm?'∞':s.scores[1]}</div></div></div><div class="progress"><div style="width:${Math.round(100*s.moves/s.max)}%"></div></div><div class="small">Ход ${Math.min(s.moves+1,s.max)} из ${s.max}</div><div class="grid">${s.board.map((n,i)=>`<button class="tile ${s.selected===i?'selected':''}" data-cell="${i}" aria-label="Кристалл ${gems[n]}">${gems[n]}</button>`).join('')}</div><div class="notice">${s.msg}</div><div class="buttons"><button id="restart">Заново</button><button class="primary" id="finish">Результат</button></div></div>`);bindBack();$('#restart').onclick=()=>crystal(s.calm);$('#finish').onclick=()=>finishCrystal();game.querySelectorAll('[data-cell]').forEach(b=>b.onclick=()=>{let n=+b.dataset.cell;if(s.selected===null){s.selected=n;s.msg='Выбери соседний кристалл для обмена.';drawCrystal();return}let i=s.selected;s.selected=null;if(!adjacent(i,n)){s.msg='Нужно выбрать соседний кристалл.';drawCrystal();return}[s.board[i],s.board[n]]=[s.board[n],s.board[i]];let match=findMatches(s.board);if(!match.length){[s.board[i],s.board[n]]=[s.board[n],s.board[i]];s.msg='Нет комбинации из трёх — попробуй другой обмен.';drawCrystal();return}let earned=settle(s.board);s.scores[s.player]+=earned;s.moves++;s.msg=`+${earned} очков! ${s.calm?'Красиво!':'Передай телефон другому игроку.'}`;if(!s.calm)s.player=1-s.player;if(s.moves>=s.max)finishCrystal();else drawCrystal()})}
function finishCrystal(){let s=state;const winner=s.scores[0]===s.scores[1]?'Ничья!':s.scores[0]>s.scores[1]?'Игрок 1 победил!':'Игрок 2 победил!';show(top('🏆 Результаты','Дуэль закончена')+`<div class="glass center"><div class="big">🏆</div><div class="heading">${s.calm?'Здорово получилось!':winner}</div><p>${s.calm?'Твои очки: '+s.scores[0]:`Игрок 1: ${s.scores[0]} · Игрок 2: ${s.scores[1]}`}</p><button class="primary" id="again">Ещё раз</button></div>`);bindBack();$('#again').onclick=()=>crystal(s.calm)}
const rounds=[{letters:['К','О','Т','Р','О','Т','А','К','Т','О','К','А','Р','А','М','А'],words:['КОТ','РОТ','ТОК','КОРА','РАМА','КОТA']},{letters:['М','И','Р','К','Н','И','Г','А','Л','У','Н','А','Р','Е','К','А'],words:['МИР','КНИГА','ЛУНА','РЕКА']}];function words(){let r=rounds[1];state={picked:[],found:[],score:0,letters:r.letters,words:r.words,msg:'Нажимай буквы по порядку, чтобы составить слово.'};drawWords()}function drawWords(){let s=state;show(top('🔤 Битва слов','Найди слова в поле. В демо — один игрок.')+`<div class="glass"><div class="row"><div class="heading">${s.score} очков</div><span class="pill">${s.found.length} / ${s.words.length} слов</span></div><div class="wordgrid">${s.letters.map((v,i)=>`<button data-letter="${i}" class="${s.picked.includes(i)?'selected':''}" ${s.picked.includes(i)?'disabled':''}>${v}</button>`).join('')}</div><div class="notice">${s.picked.map(i=>s.letters[i]).join('')||s.msg}</div><div class="wordlist">${s.words.map(w=>`<span class="${s.found.includes(w)?'done':''}">${s.found.includes(w)?'✓ ':''}${w}</span>`).join('')}</div><div class="buttons"><button id="clear">Сброс</button><button id="submit" class="primary">Проверить</button></div></div>`);bindBack();game.querySelectorAll('[data-letter]').forEach(b=>b.onclick=()=>{s.picked.push(+b.dataset.letter);drawWords()});$('#clear').onclick=()=>{s.picked=[];drawWords()};$('#submit').onclick=()=>{let w=s.picked.map(i=>s.letters[i]).join('');if(s.words.includes(w)&&!s.found.includes(w)){s.found.push(w);s.score+=w.length*10;s.msg='Отлично! Слово найдено.'}else s.msg='Не засчитано: попробуй другое слово.';s.picked=[];drawWords();if(s.found.length===s.words.length){$('.notice').textContent='Все слова найдены! 🎉'}}}
function memory(){let icons=['🐉','💜','🦊','🌙','⭐','🐱'];state={cards:shuffle([...icons,...icons]).map(icon=>({icon,up:false,matched:false})),opened:[],moves:0,lock:false};drawMemory()}function drawMemory(){let s=state;show(top('🧠 LUMI Memory','Найди 6 пар. Без таймера и штрафов.')+`<div class="glass"><div class="row"><div class="heading">${s.cards.filter(c=>c.matched).length/2} / 6 пар</div><span class="pill">${s.moves} попыток</span></div><div class="memory">${s.cards.map((c,i)=>`<button data-memory="${i}" class="${c.matched?'matched':c.up?'up':''}" aria-label="Карточка ${i+1}">${c.up||c.matched?c.icon:'✦'}</button>`).join('')}</div><div class="notice">${s.cards.every(c=>c.matched)?'🎉 Все пары найдены. Отличная разминка!':'Нажми на две карточки и найди одинаковые.'}</div><button id="restart" class="primary" style="width:100%">Новая игра</button></div>`);bindBack();$('#restart').onclick=memory;game.querySelectorAll('[data-memory]').forEach(b=>b.onclick=()=>{let i=+b.dataset.memory,c=s.cards[i];if(s.lock||c.matched||c.up)return;c.up=true;s.opened.push(i);if(s.opened.length===2){s.moves++;let [a,b]=s.opened;if(s.cards[a].icon===s.cards[b].icon){s.cards[a].matched=s.cards[b].matched=true;s.opened=[]}else{s.lock=true;timeouts.push(setTimeout(()=>{s.cards[a].up=s.cards[b].up=false;s.opened=[];s.lock=false;drawMemory()},800))}}drawMemory()})}
</script></body></html>
